name: Build app

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Unzip the project
        run: unzip -o AntiTheftAlarm.zip

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Restore private upload key (if created)
        env:
          KEYSTORE_B64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "UPLOAD_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "HAS_KEY=true" >> "$GITHUB_ENV"
          else
            echo "No upload key yet - building test versions only."
          fi

      - name: Build test APKs
        working-directory: AntiTheftAlarm
        run: gradle assemblePlayDebug assembleFullDebug --stacktrace

      - name: Build signed release (Play Store bundle + full APK)
        if: env.HAS_KEY == 'true'
        working-directory: AntiTheftAlarm
        env:
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
        run: gradle bundlePlayRelease assembleFullRelease --stacktrace

      - name: Upload test APKs
        uses: actions/upload-artifact@v4
        with:
          name: test-apks
          path: AntiTheftAlarm/app/build/outputs/apk/*/debug/*.apk

      - name: Upload release files
        if: env.HAS_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: |
            AntiTheftAlarm/app/build/outputs/bundle/playRelease/*.aab
            AntiTheftAlarm/app/build/outputs/apk/full/release/*.apk
